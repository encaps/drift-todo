[package]
name = "drift-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "macOS shell for Drift — Todo"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
